<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Images with Buttons</title>
<link rel="stylesheet" href="Css1.css">
</head>
<body>
<script src="java1.js"></script>
  
<div class="container">
  <div class="image-slide active">
    <img src="2.jpg" alt="Image 1">
  </div>
  <div class="image-slide">
    <img src="3.jpg" alt="Image 2">
  </div>
  
  <button class="nav-btn prev-btn">&lt;</button>
  <button class="nav-btn next-btn">&gt;</button>
</div>
  
<button id="start-btn">Start Experience</button>
<div class="container" style="display: none;">
 <!-- మీ ఇమేజ్ స్లైడ్‌లు ఇక్కడ ఉంటాయి -->
</div>

    <button onclick="openFullscreen()">ఫుల్‌స్క్రీన్ చేయండి</button>

    <script>
        var elem = document.documentElement;
        function openFullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
